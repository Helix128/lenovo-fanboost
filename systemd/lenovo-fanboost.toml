# /etc/lenovo-fanboost.toml
[fanboost]
profile = "Balanced"
interval = 0.5

[profiles.Quiet]
# Leaves fan control to EC until 60°C; smooth, quiet ramp
# Format: [temperature_celsius, fan_percentage_0_to_100]
# 0% = return fan control to laptop EC automatic mode.
points = [[40, 0], [60, 0], [70, 45], [80, 65], [90, 90], [95, 100]]

[profiles.Balanced]
# Balanced daily profile: EC below 50°C; progressive cooling
points = [[40, 0], [50, 0], [60, 45], [70, 65], [80, 85], [90, 100]]

[profiles.Aggressive]
# Early pre-spin: ramps up from 45°C to 100% by 75°C to avoid throttling
points = [[40, 0], [45, 40], [55, 60], [65, 80], [75, 100], [95, 100]]
