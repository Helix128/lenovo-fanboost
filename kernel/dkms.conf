PACKAGE_NAME="lenovo-fanboost"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="lenovo_fanboost"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
# Match each kernel's toolchain: CachyOS default kernels are clang-built, LTS is gcc-built.
_llvm=""
grep -q '^CONFIG_CC_IS_CLANG=y' "${kernel_source_dir}/.config" 2>/dev/null && _llvm="LLVM=1"
MAKE[0]="make -C ${kernel_source_dir} ${_llvm} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} ${_llvm} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
